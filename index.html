<body>
  <main class="app">
    <!-- 1. 雲端同步按鈕：維持原本的 100% 滿版寬度 -->
    <!-- 建立一個 Flex 容器，讓登入與登出按鈕左右並排平分空間 -->
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
      
      <!-- 登入與同步按鈕 (藍色) -->
      <button id="cloudSyncBtn" style="background:#304676; color:white; border:0; border-radius:14px; padding:12px; font-weight:720; font-size:0.95rem; cursor:pointer; flex: 1;">登入 / 同步</button>
      
      <!-- 一鍵登出按鈕 (紅色) -->
      <button id="logoutBtn" style="background:#791e32; color:white; border:0; border-radius:14px; padding:12px; font-weight:720; font-size:0.95rem; cursor:pointer; flex: 1;"> 一鍵登出</button>

    </div>
    <nav class="view-switch" aria-label="頁面切換">
      <button id="weekViewTab" class="active" aria-selected="true">週檢視</button>
      <button id="calendarViewTab" aria-selected="false">月檢視</button>
      <button id="longPlanViewTab" aria-selected="false">計畫規劃</button>
    </nav>
    <section class="view" id="weekView">
      <header class="monthbar">
        <button class="iconbtn" id="prevWeek" aria-label="上一週">‹</button>
        <h1 id="weekTitle"></h1>
        <button class="iconbtn" id="nextWeek" aria-label="下一週">›</button>
      </header>

    <header class="dialog-head"><h2 id="stageDialogTitle">新增階段</h2><button class="close-manager" id="closeStage" aria-label="關閉">×</button></header>

  <div class="toast" id="toast"></div>
  <script src="planner-time.js"></script>
  <script src="planner-agenda.js"></script>
  <script src="planner-bars.js"></script>
  <script>
    const now=new Date(),cursor=new Date(now.getFullYear(),now.getMonth(),1),weekCursor=startOfWeek(now),storageKey='lazyPlanner.tasks.v1',categoryKey='lazyPlanner.categories.v1',eventKey='lazyPlanner.events.v1',longPlanKey='lazyPlanner.longPlans.v1';
    const grid=document.querySelector('#grid'),weekGrid=document.querySelector('#weekGrid'),title=document.querySelector('#monthTitle'),weekTitle=document.querySelector('#weekTitle'),body=document.querySelector('#sheetBody'),editor=document.querySelector('#taskEditor'),eventEditor=document.querySelector('#eventEditor'),add=document.querySelector('#add');
    const defaultCategories=[{id:'A',name:'A 任務',color:'#3b82f6'},{id:'B',name:'B 任務',color:'#f43f5e'},{id:'C',name:'C 任務',color:'#f59e0b'}],newColors=['#8b5cf6','#06b6d4','#10b981','#f97316','#ec4899','#64748b'];
    let active='plan',selectedDate='',categories=loadCategories(),selectedCategory=categories[0]?.id||'',tasks=loadTasks(),events=loadEvents(),longPlans=loadLongPlans(),pendingDelete=null,editingPlanId=null,stagePlanId=null;
    function loadTasks(){try{const value=JSON.parse(localStorage.getItem(storageKey)||'[]');return Array.isArray(value)?value:[]}catch{return []}}
    function loadEvents(){try{const value=JSON.parse(localStorage.getItem(eventKey)||'[]');return Array.isArray(value)?value:[]}catch{return []}}
    function loadLongPlans(){try{const value=JSON.parse(localStorage.getItem(longPlanKey)||'[]');return Array.isArray(value)?value:[]}catch{return []}}
    function loadCategories(){try{const stored=localStorage.getItem(categoryKey);if(stored===null)return defaultCategories.map(x=>({...x}));const value=JSON.parse(stored);return Array.isArray(value)?value:defaultCategories.map(x=>({...x}))}catch{return defaultCategories.map(x=>({...x}))}}
    function saveTasks(){localStorage.setItem(storageKey,JSON.stringify(tasks));render();renderWeek();renderPanel()}
    function saveEvents(){localStorage.setItem(eventKey,JSON.stringify(events));render();renderWeek();renderPanel()}
    function saveLongPlans(){localStorage.setItem(longPlanKey,JSON.stringify(longPlans));renderLongPlans()}
    function saveCategories(refreshManager=true){localStorage.setItem(categoryKey,JSON.stringify(categories));if(!categories.some(x=>x.id===selectedCategory))selectedCategory=categories[0]?.id||'';renderLegend();renderCategoryPicker();if(refreshManager)renderCategoryManager();render();renderWeek();renderPanel()}
    function makeId(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`}
    function categoryFor(id){return categories.find(x=>x.id===id)||{id,name:'已刪除類別',color:'#94a3b8'}}
    function dateKey(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`}
    function startOfWeek(date){const value=new Date(date.getFullYear(),date.getMonth(),date.getDate()),day=value.getDay();value.setDate(value.getDate()-(day===0?6:day-1));return value}
    function escapeText(value){const node=document.createElement('div');node.textContent=value;return node.innerHTML}
    function renderLegend(){document.querySelector('#legendTasks').innerHTML=categories.map(cat=>`<span class="key"><i class="line" style="background:${cat.color}"></i>${escapeText(cat.name)}</span>`).join('')}
    function render(){
      title.textContent=`${cursor.getFullYear()} 年 ${cursor.getMonth()+1} 月`;grid.replaceChildren();const prefix=`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}-`;document.querySelector('#monthEventsCount').textContent=events.filter(x=>x.date.startsWith(prefix)).length;
      const first=new Date(cursor.getFullYear(),cursor.getMonth(),1).getDay(),days=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();
      for(let i=0;i<42;i++){const button=document.createElement('button');button.className='day';
        if(i<first||i>=first+days){button.classList.add('empty');button.disabled=true;button.setAttribute('aria-hidden','true')}
        else{const day=i-first+1,date=new Date(cursor.getFullYear(),cursor.getMonth(),day),key=dateKey(date),dayTasks=tasks.filter(x=>x.date===key),dayEvents=events.filter(x=>x.date===key);button.innerHTML=`<span class="number">${day}</span>`;
          if(dayTasks.length){const marks=document.createElement('span');marks.className='marks';dayTasks.slice(0,3).forEach(task=>{const mark=document.createElement('i');mark.className=`task-mark${task.done?' done':''}`;mark.style.background=categoryFor(task.category).color;marks.append(mark)});button.append(marks);if(dayTasks.length>3){const more=document.createElement('span');more.className='more';more.textContent=`+${dayTasks.length-3}`;button.append(more)}}
          if(dayEvents.length){const markers=document.createElement('span');markers.className='event-markers';markers.setAttribute('aria-hidden','true');dayEvents.slice(0,3).forEach(item=>{const marker=document.createElement('i');marker.className='event-marker';marker.style.color=item.color||'#22c55e';markers.append(marker)});button.append(markers)}
          button.setAttribute('aria-label',`${cursor.getMonth()+1}月${day}日，${dayTasks.length}個非計畫性事件，${dayEvents.length}個重大事項`);if(date.toDateString()===now.toDateString())button.classList.add('today');button.onclick=()=>openSheet(date)}grid.append(button)}
    }
    function move(n){cursor.setMonth(cursor.getMonth()+n);render()}
    function renderWeek(){
      const end=new Date(weekCursor);end.setDate(end.getDate()+6);const sameYear=weekCursor.getFullYear()===end.getFullYear(),startText=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'numeric',day:'numeric'}).format(weekCursor),endText=new Intl.DateTimeFormat('zh-TW',sameYear?{month:'numeric',day:'numeric'}:{year:'numeric',month:'numeric',day:'numeric'}).format(end);weekTitle.textContent=`${startText}－${endText}`;
      weekGrid.innerHTML=Array.from({length:7},(_,index)=>{const date=new Date(weekCursor);date.setDate(date.getDate()+index);const key=dateKey(date),dayTasks=PlannerTime.sortTasksByTime(tasks.filter(x=>x.date===key)),dayEvents=events.filter(x=>x.date===key),isToday=date.toDateString()===now.toDateString(),weekday=new Intl.DateTimeFormat('zh-TW',{weekday:'long'}).format(date);return `<article class="week-card${isToday?' today':''}"><button class="week-card-head" data-week-date="${key}" aria-label="開啟${date.getMonth()+1}月${date.getDate()}日"><span><span class="week-day-name">${weekday}${isToday?'・今天':''}</span><span class="week-date"><strong>${date.getDate()}</strong><span>${date.getMonth()+1} 月</span></span></span><span class="week-open">查看 ›</span></button><section class="week-block"><div class="week-block-title">重大事項 <span>${dayEvents.length}</span></div>${dayEvents.length?dayEvents.map(item=>`<div class="week-event"><i class="week-event-ring" style="color:${item.color||'#22c55e'}"></i><div><div class="week-item-title">${escapeText(item.title)}</div>${item.note?`<div class="week-item-sub">${escapeText(item.note)}</div>`:''}</div></div>`).join(''):'<div class="week-empty">沒有重大事項</div>'}</section><section class="week-block"><div class="week-block-title">當日安排 <span>${dayTasks.filter(x=>x.done).length}/${dayTasks.length}</span></div>${dayTasks.length?dayTasks.map(task=>{const cat=categoryFor(task.category);return `<div class="week-task${task.done?' done':''}"><i class="week-task-line" style="background:${cat.color}"></i><div>${task.startTime?`<div class="week-time">${PlannerTime.timeLabel(task)}</div>`:''}<div class="week-item-title">${escapeText(task.title)}</div><div class="week-item-sub" style="color:${cat.color}">${escapeText(cat.name)}</div></div></div>`}).join(''):'<div class="week-empty">沒有當日安排</div>'}</section><button class="week-card-add" data-week-date="${key}">＋ 編輯這一天</button></article>`}).join('')
    }
    function moveWeek(n){weekCursor.setDate(weekCursor.getDate()+n*7);renderWeek();weekGrid.scrollTo({left:0,behavior:'smooth'})}
    function setMainView(view){const week=view==='week',calendar=view==='calendar',long=view==='long';document.querySelector('#weekView').hidden=!week;document.querySelector('#calendarView').hidden=!calendar;document.querySelector('#longPlanView').hidden=!long;[['weekViewTab',week],['calendarViewTab',calendar],['longPlanViewTab',long]].forEach(([id,selected])=>{const tab=document.querySelector(`#${id}`);tab.classList.toggle('active',selected);tab.setAttribute('aria-selected',String(selected))});closeSheet();if(week)renderWeek();if(long)renderLongPlans()}
    function openSheet(date){selectedDate=dateKey(date);document.querySelector('#selectedDate').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(date);hideEditor();setTab('plan');document.body.classList.add('open')}
    function closeSheet(){hideEditor();document.body.classList.remove('open')}
    function empty(icon,heading,text){body.innerHTML=`<div class="empty-state"><div class="empty-icon">${icon}</div><h3>${heading}</h3><p>${text}</p></div>`}
    function renderPanel(){
      if(active==='important'){const list=events.filter(x=>x.date===selectedDate);if(!list.length){empty('○','目前沒有重大事項','按下方按鈕，加入考試、截止日或其他重要日期。');return}body.innerHTML=`<div class="event-list">${list.map(item=>`<div class="event-card"><input type="color" class="event-color" value="${item.color||'#22c55e'}" data-event-color="${item.id}" aria-label="修改${escapeText(item.title)}的顏色"><div><div class="event-title">${escapeText(item.title)}</div>${item.note?`<div class="event-note">${escapeText(item.note)}</div>`:''}</div><button class="delete" data-action="delete-event" data-id="${item.id}" aria-label="刪除重大事項">×</button></div>`).join('')}</div>`;return}
      const list=PlannerTime.sortTasksByTime(tasks.filter(x=>x.date===selectedDate));if(!list.length){empty('✓','目前沒有當日安排','按下方按鈕，加入今天要完成的事情。');return}
      const summary=categories.map(cat=>{const group=list.filter(x=>x.category===cat.id),done=group.filter(x=>x.done).length,pct=group.length?Math.round(done/group.length*100):0;return `<span class="summary-pill"><i class="summary-dot" style="background:${cat.color}"></i>${escapeText(cat.name)} ${pct}%</span>`}).join('');
      body.innerHTML=`<div class="summary">${summary}</div><div class="task-list">${list.map(task=>{const cat=categoryFor(task.category);return `<div class="task-item"><button class="check ${task.done?'checked':''}" data-action="toggle" data-id="${task.id}" aria-label="${task.done?'取消完成':'標示完成'}">${task.done?'✓':''}</button><div class="task-copy"><div class="task-name ${task.done?'completed':''}">${escapeText(task.title)}</div>${task.startTime?`<div class="task-time">◷ ${PlannerTime.timeLabel(task)}</div>`:''}<div class="task-type" style="color:${cat.color}">${escapeText(cat.name)}</div></div><button class="delete" data-action="delete" data-id="${task.id}" aria-label="刪除非計畫性事件">×</button></div>`}).join('')}</div>`;
    }
    function setTab(key){active=key;hideEditor();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===key));add.textContent=key==='plan'?'＋ 新增非計畫性事件':'＋ 新增事項';renderPanel()}
    function showEditor(){body.style.display='none';add.style.display='none';if(active==='important'){eventEditor.classList.add('show');document.querySelector('#eventName').value='';document.querySelector('#eventNote').value='';document.querySelector('#eventColor').value='#22c55e';setTimeout(()=>document.querySelector('#eventName').focus(),50);return}if(!categories.length){closeSheet();openCategoryManager();showToast('請先新增一個非計畫性事件類別');return}editor.classList.add('show');document.querySelector('#taskName').value='';document.querySelector('#taskStartTime').value='';document.querySelector('#taskEndTime').value='';document.querySelector('#taskTimeError').textContent='';document.querySelector('#taskTimeFields').hidden=true;document.querySelector('#addTimeSlot').textContent='＋ 加入時段';renderCategoryPicker();selectCategory(categories[0].id);setTimeout(()=>document.querySelector('#taskName').focus(),50)}
    function hideEditor(){editor.classList.remove('show');eventEditor.classList.remove('show');body.style.display='';add.style.display='';}
    function renderCategoryPicker(){document.querySelector('#categoryPicker').innerHTML=categories.map(cat=>`<button type="button" class="cat${cat.id===selectedCategory?' selected':''}" data-value="${cat.id}" style="${cat.id===selectedCategory?`background:${cat.color}`:''}">${escapeText(cat.name)}</button>`).join('')}
    function selectCategory(value){selectedCategory=value;renderCategoryPicker()}
    function renderCategoryManager(){document.querySelector('#categoryList').innerHTML=categories.map(cat=>`<div class="category-row"><input class="color-picker" type="color" value="${cat.color}" data-category-color="${cat.id}" aria-label="${escapeText(cat.name)}顏色"><input class="category-name" maxlength="18" value="${escapeText(cat.name)}" data-category-name="${cat.id}" aria-label="類別名稱"><button class="remove-category" data-remove-category="${cat.id}" aria-label="刪除${escapeText(cat.name)}">×</button></div>`).join('')}
    function openCategoryManager(){renderCategoryManager();document.querySelector('#categoryBackdrop').classList.add('show');document.querySelector('#categoryDialog').classList.add('show')}
    function closeCategoryManager(){document.querySelector('#categoryBackdrop').classList.remove('show');document.querySelector('#categoryDialog').classList.remove('show')}
    function dateFromKey(key){const [year,month,day]=key.split('-').map(Number);return new Date(year,month-1,day)}
    function formatPlanDate(key){return new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric'}).format(dateFromKey(key))}
    function renderLongPlans(){
      const target=document.querySelector('#longPlanList'),plans=[...longPlans].sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));
      if(!plans.length){target.innerHTML='<section class="long-empty-card"><div class="empty-state"><div class="empty-icon">◎</div><h3>目前沒有長期計畫</h3><p>按右上方「新增計畫」，把大目標拆成幾個可完成的階段。</p></div></section>';return}
      target.innerHTML=plans.map(plan=>{const stages=Array.isArray(plan.stages)?[...plan.stages].sort((a,b)=>(a.targetDate||'').localeCompare(b.targetDate||'')):[],done=stages.filter(x=>x.done).length,pct=stages.length?Math.round(done/stages.length*100):0,color=plan.color||'#4f46e5';return `<article class="plan-card" style="--plan-color:${color};--progress:${pct}%"><div class="plan-top"><div><div class="plan-title">${escapeText(plan.title)}</div><div class="plan-dates">${formatPlanDate(plan.startDate)}－${formatPlanDate(plan.endDate)}</div></div><div class="plan-actions"><button class="plan-action" data-long-action="edit-plan" data-plan-id="${plan.id}" aria-label="編輯${escapeText(plan.title)}">✎</button><button class="plan-action delete-plan" data-long-action="delete-plan" data-plan-id="${plan.id}" aria-label="刪除${escapeText(plan.title)}">×</button></div></div>${plan.note?`<p class="plan-note">${escapeText(plan.note)}</p>`:''}<div class="progress-head"><span>已完成 ${done}／${stages.length} 個階段</span><strong>${pct}%</strong></div><div class="progress-track"><div class="progress-fill"></div></div><div class="stage-list">${stages.map(stage=>`<div class="stage-item"><button class="stage-check${stage.done?' checked':''}" data-long-action="toggle-stage" data-plan-id="${plan.id}" data-stage-id="${stage.id}" aria-label="${stage.done?'取消完成':'標示完成'}${escapeText(stage.title)}">${stage.done?'✓':''}</button><div class="stage-copy"><div class="stage-name${stage.done?' completed':''}">${escapeText(stage.title)}</div><div class="stage-date">預計 ${formatPlanDate(stage.targetDate)}</div></div><button class="stage-delete" data-long-action="delete-stage" data-plan-id="${plan.id}" data-stage-id="${stage.id}" aria-label="刪除${escapeText(stage.title)}">×</button></div>`).join('')}</div><button class="add-stage" data-long-action="add-stage" data-plan-id="${plan.id}">＋ 加入下一階段</button></article>`}).join('')
    }
    function openLongPlanDialog(id=null){editingPlanId=id;const plan=longPlans.find(x=>x.id===id),start=dateKey(now),endDate=new Date(now.getFullYear(),now.getMonth(),now.getDate()+30);document.querySelector('#longPlanDialogTitle').textContent=plan?'編輯長期計畫':'新增長期計畫';document.querySelector('#longPlanName').value=plan?.title||'';document.querySelector('#longPlanColor').value=plan?.color||'#4f46e5';document.querySelector('#longPlanStart').value=plan?.startDate||start;document.querySelector('#longPlanEnd').value=plan?.endDate||dateKey(endDate);document.querySelector('#longPlanNote').value=plan?.note||'';document.querySelector('#longPlanError').textContent='';document.querySelector('#longPlanBackdrop').classList.add('show');document.querySelector('#longPlanDialog').classList.add('show');setTimeout(()=>document.querySelector('#longPlanName').focus(),30)}
    function closeLongPlanDialog(){editingPlanId=null;document.querySelector('#longPlanBackdrop').classList.remove('show');document.querySelector('#longPlanDialog').classList.remove('show')}
    function openStageDialog(planId){stagePlanId=planId;const plan=longPlans.find(x=>x.id===planId);document.querySelector('#stageName').value='';document.querySelector('#stageDate').value=plan?.endDate||dateKey(now);document.querySelector('#stageError').textContent='';document.querySelector('#stageBackdrop').classList.add('show');document.querySelector('#stageDialog').classList.add('show');setTimeout(()=>document.querySelector('#stageName').focus(),30)}
    function closeStageDialog(){stagePlanId=null;document.querySelector('#stageBackdrop').classList.remove('show');document.querySelector('#stageDialog').classList.remove('show')}
    function renderMonthEvents(){const prefix=`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}-`,list=events.filter(x=>x.date.startsWith(prefix)).sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title,'zh-Hant'));document.querySelector('#monthEventsTitle').textContent=`${cursor.getFullYear()} 年 ${cursor.getMonth()+1} 月重大事項`;document.querySelector('#monthEventsList').innerHTML=list.length?list.map(item=>{const date=dateFromKey(item.date),dateText=new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}).format(date);return `<button class="month-event-item" data-month-date="${item.date}"><span class="month-event-date">${dateText}</span><span class="month-event-ring" style="color:${item.color||'#22c55e'}"></span><span><span class="month-event-title">${escapeText(item.title)}</span>${item.note?`<span class="month-event-note">${escapeText(item.note)}</span>`:''}</span><span class="month-event-arrow">›</span></button>`}).join(''):'<div class="month-empty">這個月還沒有重大事項</div>'}
    function openMonthEvents(){renderMonthEvents();document.querySelector('#monthEventsBackdrop').classList.add('show');document.querySelector('#monthEventsDialog').classList.add('show')}
    function closeMonthEvents(){document.querySelector('#monthEventsBackdrop').classList.remove('show');document.querySelector('#monthEventsDialog').classList.remove('show')}
    function askDelete(message,action){pendingDelete=action;document.querySelector('#confirmMessage').textContent=message;document.querySelector('#confirmBackdrop').classList.add('show');document.querySelector('#confirmDialog').classList.add('show');setTimeout(()=>document.querySelector('#confirmDelete').focus(),30)}
    function closeConfirm(){pendingDelete=null;document.querySelector('#confirmBackdrop').classList.remove('show');document.querySelector('#confirmDialog').classList.remove('show')}
    function showToast(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)}
    body.onclick=e=>{const button=e.target.closest('[data-action]');if(!button)return;const id=button.dataset.id;if(button.dataset.action==='toggle'){tasks=tasks.map(x=>x.id===id?{...x,done:!x.done}:x);saveTasks()}if(button.dataset.action==='delete'){askDelete('刪除後無法復原，確定刪除這個非計畫性事件？',()=>{tasks=tasks.filter(x=>x.id!==id);saveTasks();showToast('非計畫性事件已刪除')})}if(button.dataset.action==='delete-event'){askDelete('刪除後無法復原，確定刪除這個重大事項？',()=>{events=events.filter(x=>x.id!==id);saveEvents();showToast('重大事項已刪除')})}};
    body.onchange=e=>{const id=e.target.dataset.eventColor;if(!id)return;events=events.map(item=>item.id===id?{...item,color:e.target.value}:item);saveEvents();showToast('顏色已更新')};
    editor.onsubmit=e=>{e.preventDefault();const input=document.querySelector('#taskName'),name=input.value.trim(),fields=document.querySelector('#taskTimeFields'),startTime=fields.hidden?'':document.querySelector('#taskStartTime').value,endTime=fields.hidden?'':document.querySelector('#taskEndTime').value,error=document.querySelector('#taskTimeError');if(!name)return;if(!PlannerTime.isValidTimeRange(startTime,endTime)){error.textContent=startTime&&endTime?'結束時間必須晚於開始時間。':'請同時選擇開始與結束時間。';return}tasks.push({id:makeId(),date:selectedDate,title:name,category:selectedCategory,done:false,...(startTime?{startTime,endTime}:{})});hideEditor();saveTasks();showToast('非計畫性事件已儲存')};
    eventEditor.onsubmit=e=>{e.preventDefault();const name=document.querySelector('#eventName').value.trim(),note=document.querySelector('#eventNote').value.trim(),color=document.querySelector('#eventColor').value;if(!name)return;events.push({id:makeId(),date:selectedDate,title:name,note,color});hideEditor();saveEvents();showToast('重大事項已儲存')};
    document.querySelector('#longPlanForm').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#longPlanName').value.trim(),color=document.querySelector('#longPlanColor').value,startDate=document.querySelector('#longPlanStart').value,endDate=document.querySelector('#longPlanEnd').value,note=document.querySelector('#longPlanNote').value.trim(),error=document.querySelector('#longPlanError');if(!title||!startDate||!endDate)return;if(endDate<startDate){error.textContent='目標日期不能早於開始日期。';return}const id=editingPlanId,existing=longPlans.find(x=>x.id===id);if(existing&&(existing.stages||[]).some(stage=>stage.targetDate<startDate||stage.targetDate>endDate)){error.textContent='已有階段落在新的日期範圍外，請先調整計畫日期。';return}if(existing){longPlans=longPlans.map(x=>x.id===id?{...x,title,color,startDate,endDate,note}:x)}else{longPlans.push({id:makeId(),title,color,startDate,endDate,note,stages:[]})}closeLongPlanDialog();saveLongPlans();showToast(existing?'計畫已更新':'計畫已建立')};
    document.querySelector('#stageForm').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#stageName').value.trim(),targetDate=document.querySelector('#stageDate').value,error=document.querySelector('#stageError'),plan=longPlans.find(x=>x.id===stagePlanId);if(!title||!targetDate||!plan)return;if(targetDate<plan.startDate||targetDate>plan.endDate){error.textContent='階段日期需落在計畫的開始與目標日期之間。';return}const planId=stagePlanId;longPlans=longPlans.map(x=>x.id===planId?{...x,stages:[...(Array.isArray(x.stages)?x.stages:[]),{id:makeId(),title,targetDate,done:false}]}:x);closeStageDialog();saveLongPlans();showToast('階段已加入')};
    document.querySelector('#longPlanList').onclick=e=>{const button=e.target.closest('[data-long-action]');if(!button)return;const action=button.dataset.longAction,planId=button.dataset.planId,stageId=button.dataset.stageId,plan=longPlans.find(x=>x.id===planId);if(!plan)return;if(action==='edit-plan'){openLongPlanDialog(planId);return}if(action==='add-stage'){openStageDialog(planId);return}if(action==='toggle-stage'){longPlans=longPlans.map(x=>x.id===planId?{...x,stages:(x.stages||[]).map(stage=>stage.id===stageId?{...stage,done:!stage.done}:stage)}:x);saveLongPlans();return}if(action==='delete-stage'){const stage=(plan.stages||[]).find(x=>x.id===stageId);askDelete(`確定刪除階段「${stage?.title||''}」？`,()=>{longPlans=longPlans.map(x=>x.id===planId?{...x,stages:(x.stages||[]).filter(stage=>stage.id!==stageId)}:x);saveLongPlans();showToast('階段已刪除')});return}if(action==='delete-plan'){const count=(plan.stages||[]).length,detail=count?`，其中的 ${count} 個階段也會一起刪除`:'';askDelete(`確定刪除「${plan.title}」${detail}？此動作無法復原。`,()=>{longPlans=longPlans.filter(x=>x.id!==planId);saveLongPlans();showToast('長期計畫已刪除')})}};
    document.querySelector('#categoryPicker').onclick=e=>{const button=e.target.closest('[data-value]');if(button)selectCategory(button.dataset.value)};
    document.querySelector('#categoryList').onchange=e=>{const id=e.target.dataset.categoryName||e.target.dataset.categoryColor;if(!id)return;const cat=categories.find(x=>x.id===id);if(!cat)return;if(e.target.dataset.categoryName){const name=e.target.value.trim();if(!name){e.target.value=cat.name;return}cat.name=name}else cat.color=e.target.value;saveCategories(false)};
    document.querySelector('#categoryList').onclick=e=>{const button=e.target.closest('[data-remove-category]');if(!button)return;const id=button.dataset.removeCategory,cat=categoryFor(id),count=tasks.filter(x=>x.category===id).length,message=count?`刪除「${cat.name}」時，也會刪除其中 ${count} 個非計畫性事件。此動作無法復原。`:`確定刪除「${cat.name}」？此動作無法復原。`;askDelete(message,()=>{categories=categories.filter(x=>x.id!==id);tasks=tasks.filter(x=>x.category!==id);localStorage.setItem(storageKey,JSON.stringify(tasks));saveCategories();showToast('類別已刪除')})};
    document.querySelector('#addCategory').onclick=()=>{const index=categories.length;categories.push({id:makeId(),name:`新類別 ${index+1}`,color:newColors[index%newColors.length]});saveCategories();setTimeout(()=>{const inputs=document.querySelectorAll('.category-name');const last=inputs[inputs.length-1];last?.focus();last?.select()},30)};
    document.querySelector('#manageCategories').onclick=openCategoryManager;document.querySelector('#closeCategories').onclick=closeCategoryManager;document.querySelector('#categoryBackdrop').onclick=closeCategoryManager;
    document.querySelector('#monthEventsTrigger').onclick=openMonthEvents;document.querySelector('#closeMonthEvents').onclick=closeMonthEvents;document.querySelector('#monthEventsBackdrop').onclick=closeMonthEvents;document.querySelector('#monthEventsList').onclick=e=>{const item=e.target.closest('[data-month-date]');if(!item)return;const date=dateFromKey(item.dataset.monthDate);closeMonthEvents();openSheet(date);setTab('important')};
    document.querySelector('#addLongPlan').onclick=()=>openLongPlanDialog();document.querySelector('#closeLongPlan').onclick=closeLongPlanDialog;document.querySelector('#cancelLongPlan').onclick=closeLongPlanDialog;document.querySelector('#longPlanBackdrop').onclick=closeLongPlanDialog;document.querySelector('#closeStage').onclick=closeStageDialog;document.querySelector('#cancelStage').onclick=closeStageDialog;document.querySelector('#stageBackdrop').onclick=closeStageDialog;
    document.querySelector('#confirmCancel').onclick=closeConfirm;document.querySelector('#confirmBackdrop').onclick=closeConfirm;document.querySelector('#confirmDelete').onclick=()=>{const action=pendingDelete;closeConfirm();if(action)action()};
    document.querySelector('#weekViewTab').onclick=()=>setMainView('week');document.querySelector('#calendarViewTab').onclick=()=>setMainView('calendar');document.querySelector('#longPlanViewTab').onclick=()=>setMainView('long');document.querySelector('#prevWeek').onclick=()=>moveWeek(-1);document.querySelector('#nextWeek').onclick=()=>moveWeek(1);weekGrid.onclick=e=>{const target=e.target.closest('[data-week-date]');if(target)openSheet(dateFromKey(target.dataset.weekDate))};document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#done').onclick=closeSheet;document.querySelector('#backdrop').onclick=closeSheet;document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>setTab(x.dataset.tab));document.querySelector('#addTimeSlot').onclick=()=>{const fields=document.querySelector('#taskTimeFields'),opening=fields.hidden;fields.hidden=!opening;document.querySelector('#addTimeSlot').textContent=opening?'－ 移除時段':'＋ 加入時段';document.querySelector('#taskTimeError').textContent='';if(!opening){document.querySelector('#taskStartTime').value='';document.querySelector('#taskEndTime').value=''}else setTimeout(()=>document.querySelector('#taskStartTime').focus(),30)};document.querySelector('#cancelTask').onclick=()=>{hideEditor();renderPanel()};document.querySelector('#cancelEvent').onclick=()=>{hideEditor();renderPanel()};add.onclick=showEditor;
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('#confirmDialog').classList.contains('show')){closeConfirm();return}if(document.querySelector('#stageDialog').classList.contains('show')){closeStageDialog();return}if(document.querySelector('#longPlanDialog').classList.contains('show')){closeLongPlanDialog();return}if(document.querySelector('#monthEventsDialog').classList.contains('show')){closeMonthEvents();return}if(document.querySelector('#categoryDialog').classList.contains('show')){closeCategoryManager();return}editor.classList.contains('show')||eventEditor.classList.contains('show')?(hideEditor(),renderPanel()):closeSheet()}if(!document.body.classList.contains('open')&&!document.querySelector('#weekView').hidden&&e.key==='ArrowLeft')moveWeek(-1);if(!document.body.classList.contains('open')&&!document.querySelector('#weekView').hidden&&e.key==='ArrowRight')moveWeek(1);if(!document.body.classList.contains('open')&&!document.querySelector('#calendarView').hidden&&e.key==='ArrowLeft')move(-1);if(!document.body.classList.contains('open')&&!document.querySelector('#calendarView').hidden&&e.key==='ArrowRight')move(1)});
    let startY=0;document.querySelector('.sheet').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});document.querySelector('.sheet').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-startY>90&&!editor.classList.contains('show')&&!eventEditor.classList.contains('show'))closeSheet()},{passive:true});
    renderLegend();renderCategoryPicker();render();renderLongPlans();setMainView('week');
